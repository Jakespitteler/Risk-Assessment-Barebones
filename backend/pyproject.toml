[project]
name = "risk-assessment"
version = "0.1.0"
description = "The Take 5 app's back end: every rule and all the data."
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
dependencies = [
    "anthropic>=2.10",
    "fastapi>=0.162",
    "openai>=3.48",
    "pydantic>=2.14",
    "pydantic-settings>=2.12",
    "python-multipart>=0.0.34",
    "uvicorn>=0.54",
]

[dependency-groups]
dev = ["httpx2>=2.16", "pyright>=1.1.414", "pytest>=9.2", "ruff>=0.17"]

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[tool.ruff.lint]
# E/W/F: errors, I: import order, N: naming, UP: modern Python, B: likely bugs,
# SIM: simpler code, ANN: type hints everywhere, D: docstrings,
# COM812: a trailing comma, so anything too long for one line gets one item per line.
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "ANN", "D", "COM812"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
# The real AI costs money, so its test runs only when asked: `uv run pytest -m real_ai`.
addopts = "-m 'not real_ai'"
markers = [
    "real_ai: calls the real AI provider, so it is skipped unless TAKE5_AI_KEY is set",
]
