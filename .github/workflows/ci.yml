# Runs every check in scripts/check.py on each pull request and each push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the back end
        run: uv sync --locked
        working-directory: backend
      - name: Install the front end
        run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run every check
        run: uv run scripts/check.py
      - name: Attach phone screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phone-screenshots
          path: frontend/test-results/screenshots/*.png
          if-no-files-found: ignore
